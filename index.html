<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Round the Bases — Daily Baseball Puzzle</title>
<meta name="description" content="One at-bat per day. Four pitches of escalating difficulty. Real baseball scoring." />
<meta property="og:title" content="Round the Bases" />
<meta property="og:description" content="Daily baseball puzzle. One at-bat, four pitches, real baseball scoring." />
<meta property="og:type" content="website" />
<meta property="og:image" content="og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Round the Bases" />
<meta name="twitter:description" content="Daily baseball puzzle. One at-bat, four pitches, real baseball scoring." />
<meta name="twitter:image" content="og.png" />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#355A3A" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Round the Bases" />

<!-- GoatCounter Analytics — privacy-first, no cookies, custom events supported. -->
<script data-goatcounter="https://roundthebases.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Old+Standard+TT:wght@400;700&family=Special+Elite&family=Oswald:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:   #F1E4C8;
    --cream-2: #E8D7B4;
    --ink:     #1A1612;
    --red:     #B22A2B;
    --green:   #355A3A;
    --dirt:    #8B6A3F;
    --gold:    #C9A14C;
    --line:    rgba(26, 22, 18, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'Old Standard TT', Georgia, serif; min-height: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(26,22,18,0.05) 1px, transparent 1px),
      radial-gradient(rgba(178,42,43,0.04) 1px, transparent 1px);
    background-size: 4px 4px, 7px 7px;
    background-position: 0 0, 2px 3px;
    pointer-events: none; z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto; padding: 24px 20px 40px;
  }

  /* HEADER */
  header { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 18px; }
  .eyebrow {
    font-family: 'Special Elite', monospace;
    text-transform: uppercase; letter-spacing: 0.3em; font-size: 11px; color: var(--red);
  }
  h1 {
    font-family: 'Alfa Slab One', serif; font-weight: 400;
    font-size: 38px; line-height: 0.95; letter-spacing: 0.01em;
    margin: 8px 0 4px; text-transform: uppercase;
  }
  .subhead {
    font-family: 'Special Elite', monospace;
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
  }
  .subhead .pipe { color: var(--red); margin: 0 6px; }

  /* SCOREBOARD */
  .scoreboard {
    background: var(--green); color: var(--cream);
    border: 2px solid var(--ink); border-radius: 2px;
    padding: 14px 16px;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
    align-items: center; margin-bottom: 18px;
    box-shadow: 0 4px 0 var(--ink); position: relative;
  }
  .scoreboard::before, .scoreboard::after {
    content: ""; position: absolute; top: -2px; bottom: -2px; width: 14px;
    background: repeating-linear-gradient(0deg, var(--ink) 0 4px, transparent 4px 8px);
  }
  .scoreboard::before { left: -2px; } .scoreboard::after { right: -2px; }
  .sb-label {
    font-family: 'Special Elite', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85;
  }
  .sb-val {
    font-family: 'Alfa Slab One', serif; font-size: 28px; line-height: 1; margin-top: 2px;
  }
  .sb-strikes { text-align: center; }
  .sb-outs    { text-align: right; }

  .weekly {
    background: var(--cream-2);
    border: 2px solid var(--ink); border-top: none;
    padding: 6px 14px; margin: -2px 0 18px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Special Elite', monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    box-shadow: 0 4px 0 var(--ink);
  }
  .weekly .wk-val { font-family: 'Alfa Slab One', serif; font-size: 16px; color: var(--red); margin-right: 4px; }
  .weekly .wk-dots { display: flex; gap: 3px; }
  .weekly .wk-dot {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid var(--ink); background: var(--cream);
  }
  .weekly .wk-dot.played { background: var(--red); border-color: var(--red); }
  .weekly .wk-dot.today { box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--ink); }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
  .dots.dots-r { justify-content: flex-end; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--cream); background: transparent;
  }
  .dot.on { background: var(--red); border-color: var(--red); }

  /* DIAMOND */
  .diamond-wrap { display: flex; justify-content: center; margin: 0 0 18px; }
  .diamond { width: 200px; height: 200px; }
  .diamond svg { width: 100%; height: 100%; display: block; }
  .base { fill: var(--cream); stroke: var(--ink); stroke-width: 2; transition: fill 200ms ease; }
  .base.occupied { fill: var(--red); }

  /* PITCH CARD */
  .card {
    background: var(--cream-2); border: 2px solid var(--ink); border-radius: 3px;
    padding: 18px 18px 22px; position: relative; box-shadow: 6px 6px 0 var(--ink);
  }
  .card::before {
    content: ""; position: absolute; top: -2px; left: 8px; right: 8px; height: 2px;
    background-image: radial-gradient(circle, var(--cream) 2px, transparent 2.5px);
    background-size: 12px 4px; background-repeat: repeat-x; background-position: 0 -1px;
  }
  .pitch-tag {
    display: inline-block; background: var(--red); color: var(--cream);
    font-family: 'Alfa Slab One', serif; font-size: 12px; letter-spacing: 0.18em;
    padding: 4px 10px 3px; margin-bottom: 12px; transform: rotate(-1.5deg);
  }
  .pitch-tag .tier { color: #F5E2A4; }
  .prompt { font-family: 'Old Standard TT', serif; font-size: 22px; line-height: 1.3; margin: 0 0 16px; }
  .opening-hint {
    font-family: 'Special Elite', monospace; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--red); margin-bottom: 14px;
  }

  /* ARSENAL */
  .arsenal { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
  .arsenal .ars-emoji { font-size: 22px; }
  .arsenal .ars-name {
    font-family: 'Oswald', sans-serif; font-weight: 600;
    font-size: 16px; letter-spacing: 0.05em;
  }
  /* Numerals use Oswald (clear, condensed) with tabular nums so the columns
     line up regardless of digit width. Special Elite is gorgeous for prose
     but its '%' and decimals get cramped at small sizes. */
  .arsenal .ars-speed,
  .arsenal .ars-usage {
    font-family: 'Oswald', sans-serif; font-size: 17px;
    font-feature-settings: "tnum";
    text-align: right; letter-spacing: 0.02em;
  }
  .arsenal .ars-speed { font-weight: 500; }
  .arsenal .ars-usage { font-weight: 700; color: var(--red); min-width: 46px; }

  /* CHOICES */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    background: var(--cream); border: 2px solid var(--ink); color: var(--ink);
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 14px 8px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    transition: transform 80ms ease, background 80ms ease, opacity 200ms ease;
  }
  .choice:hover:not(:disabled) { background: #fff5dc; }
  .choice:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .choice.wrong { opacity: 0.35; text-decoration: line-through; }
  .choice:disabled { cursor: not-allowed; }

  /* TEXT INPUT (3B/HR) */
  .input-wrap { position: relative; }
  .input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .text-input {
    background: var(--cream); border: 2px solid var(--ink); color: var(--ink);
    font-family: 'Old Standard TT', serif; font-size: 18px; padding: 12px 12px;
    width: 100%; box-shadow: 3px 3px 0 var(--ink); outline: none;
  }
  .text-input:focus { background: #fff5dc; }
  .swing-btn {
    background: var(--red); color: var(--cream); border: 2px solid var(--ink);
    font-family: 'Alfa Slab One', serif; font-size: 14px; letter-spacing: 0.15em;
    padding: 0 18px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
  }
  .swing-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .swing-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .autocomplete {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
    background: var(--cream); border: 2px solid var(--ink); margin-top: 4px;
    max-height: 180px; overflow-y: auto; box-shadow: 3px 3px 0 var(--ink);
  }
  .autocomplete div {
    padding: 8px 12px; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 15px; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--line);
  }
  .autocomplete div:hover, .autocomplete div.active { background: #fff5dc; }

  /* PAST GUESSES */
  .past {
    margin-top: 14px; font-family: 'Special Elite', monospace; font-size: 12px;
    letter-spacing: 0.08em;
  }
  .past .row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .past .x { color: var(--red); font-weight: 700; }
  .past .ginfo { opacity: 0.7; }

  /* HINTS */
  .hints { margin-top: 12px; }
  .hint {
    background: rgba(178,42,43,0.08); border-left: 3px solid var(--red);
    padding: 6px 10px; margin-top: 6px;
    font-family: 'Special Elite', monospace; font-size: 12px; letter-spacing: 0.08em;
  }
  .hint::before { content: "HINT  "; color: var(--red); font-weight: 700; }

  /* RESULT SCREEN */
  .result-card {
    background: var(--cream-2); border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink); padding: 22px 20px; position: relative;
  }
  .result-card::before {
    content: ""; position: absolute; top: -2px; left: 8px; right: 8px; height: 2px;
    background-image: radial-gradient(circle, var(--cream) 2px, transparent 2.5px);
    background-size: 12px 4px; background-repeat: repeat-x; background-position: 0 -1px;
  }
  .result-title {
    font-family: 'Alfa Slab One', serif; font-size: 32px; line-height: 1;
    text-transform: uppercase; margin: 0 0 8px;
  }
  .result-sub {
    font-family: 'Special Elite', monospace; font-size: 12px;
    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 18px;
  }
  .result-bases {
    font-family: 'Special Elite', monospace; font-size: 13px; letter-spacing: 0.05em;
    line-height: 1.8; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 10px 0; margin-bottom: 16px;
  }
  .result-bases .br-row { display: grid; grid-template-columns: 30px 24px 1fr; align-items: baseline; gap: 6px; }
  .result-bases .br-tier { font-family: 'Alfa Slab One', serif; font-size: 13px; }
  .result-bases .br-mark { font-size: 16px; }
  .result-bases .miss { opacity: 0.55; }
  .result-bases .miss .ans { color: var(--red); }
  .result-bases .br-detail {
    font-family: 'Special Elite', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin-left: 4px;
  }

  .share-card {
    background: var(--cream); border: 2px dashed var(--ink); padding: 14px 16px;
    margin-bottom: 14px; white-space: pre-wrap;
    font-family: 'Special Elite', monospace; font-size: 13px; letter-spacing: 0.06em;
    line-height: 1.5;
  }
  .share-btn {
    width: 100%; background: var(--red); color: var(--cream); border: 2px solid var(--ink);
    font-family: 'Alfa Slab One', serif; font-size: 16px; letter-spacing: 0.15em;
    padding: 14px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
  }
  .share-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .tomorrow {
    text-align: center; margin-top: 16px;
    font-family: 'Special Elite', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--red);
  }

  /* Onboarding modal — first visit only */
  .onboard-mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(26, 22, 18, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .onboard {
    background: var(--cream-2); border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink); max-width: 420px; width: 100%;
    padding: 24px 22px; position: relative;
  }
  .onboard::before {
    content: ""; position: absolute; top: -2px; left: 8px; right: 8px; height: 2px;
    background-image: radial-gradient(circle, var(--cream) 2px, transparent 2.5px);
    background-size: 12px 4px; background-repeat: repeat-x; background-position: 0 -1px;
  }
  .onboard h2 {
    font-family: 'Alfa Slab One', serif; font-size: 24px; line-height: 1;
    margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .onboard .ob-steps { font-family: 'Old Standard TT', serif; font-size: 16px; line-height: 1.5; margin-bottom: 16px; }
  .onboard .ob-steps b { font-family: 'Alfa Slab One', serif; color: var(--red); font-size: 14px; letter-spacing: 0.1em; }
  .onboard .ob-step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin-bottom: 8px; align-items: baseline; }
  .onboard .ob-num {
    font-family: 'Alfa Slab One', serif; font-size: 13px; color: var(--red);
    background: var(--cream); border: 2px solid var(--ink);
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .onboard-go {
    width: 100%; background: var(--red); color: var(--cream); border: 2px solid var(--ink);
    font-family: 'Alfa Slab One', serif; font-size: 16px; letter-spacing: 0.15em;
    padding: 12px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); text-transform: uppercase;
  }
  .onboard-go:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }

  /* A2HS card — shown after first completed game */
  .a2hs {
    margin-top: 18px;
    background: var(--cream); border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 14px 16px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
    align-items: center; position: relative;
  }
  .a2hs-icon {
    width: 44px; height: 44px;
    background: var(--green); color: var(--cream);
    border: 2px solid var(--ink); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .a2hs-body { line-height: 1.25; }
  .a2hs-title {
    font-family: 'Alfa Slab One', serif; font-size: 14px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .a2hs-text {
    font-family: 'Special Elite', monospace; font-size: 11px;
    letter-spacing: 0.05em; color: var(--ink); opacity: 0.85; margin-top: 2px;
  }
  .a2hs-action {
    background: var(--red); color: var(--cream);
    border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    font-family: 'Alfa Slab One', serif; font-size: 11px;
    letter-spacing: 0.12em; padding: 8px 12px; cursor: pointer;
    text-transform: uppercase;
  }
  .a2hs-action:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .a2hs-dismiss {
    position: absolute; top: 4px; right: 6px;
    background: none; border: none; padding: 0; font-size: 16px;
    cursor: pointer; color: var(--ink); opacity: 0.5; line-height: 1;
  }
  .a2hs-dismiss:hover { opacity: 1; }
  .a2hs-ios-steps {
    grid-column: 1 / -1;
    font-family: 'Special Elite', monospace; font-size: 11px;
    letter-spacing: 0.05em; margin-top: 4px; line-height: 1.5;
  }
  .a2hs-ios-steps b { color: var(--red); }

  .boxscore {
    margin-top: 22px; border-top: 3px double var(--ink); padding-top: 12px;
  }
  .bs-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .bs-title {
    font-family: 'Alfa Slab One', serif; font-size: 14px;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .bs-nav {
    display: flex; gap: 6px;
  }
  .bs-nav-btn {
    background: var(--cream); border: 2px solid var(--ink); color: var(--ink);
    font-family: 'Alfa Slab One', serif; font-size: 14px;
    width: 28px; height: 28px; padding: 0; cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink); line-height: 1;
  }
  .bs-nav-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .bs-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .bs-row, .bs-total {
    display: grid; grid-template-columns: 36px 66px 1fr 56px;
    gap: 8px; align-items: baseline; padding: 4px 0;
    font-family: 'Special Elite', monospace; font-size: 12px;
    letter-spacing: 0.04em;
    border-bottom: 1px dotted var(--line);
  }
  .bs-row.today { background: rgba(178,42,43,0.06); margin: 0 -6px; padding: 4px 6px; border-bottom-color: var(--line); }
  .bs-row.today .bs-day, .bs-row.today .bs-runs { color: var(--red); }
  .bs-row.missed { opacity: 0.4; }
  .bs-row.future { opacity: 0.55; }
  .bs-row.future .bs-grid { letter-spacing: 2px; }
  .bs-day { font-family: 'Alfa Slab One', serif; font-size: 11px; letter-spacing: 0.1em; }
  .bs-date { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
  .bs-grid { font-size: 14px; letter-spacing: 0.02em; }
  .bs-runs { text-align: right; font-weight: 700; }
  .bs-total {
    border-bottom: none; border-top: 2px solid var(--ink); margin-top: 2px; padding-top: 6px;
    font-family: 'Alfa Slab One', serif; font-size: 12px; letter-spacing: 0.08em;
  }

  /* FOOTER */
  footer {
    text-align: center; margin-top: 28px;
    font-family: 'Special Elite', monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.65;
  }
  footer .star { color: var(--red); }

  /* DEV reset */
  .dev-reset {
    margin-top: 12px; text-align: center;
    font-family: 'Special Elite', monospace; font-size: 10px; letter-spacing: 0.2em;
  }
  .dev-reset a { color: var(--ink); opacity: 0.4; cursor: pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">★ Daily ★</div>
      <h1>Round the Bases</h1>
      <div class="subhead">
        <span id="day-no">Day No. —</span> <span class="pipe">|</span> <span id="day-date">—</span>
        <span class="pipe" id="streak-pipe">|</span> <span id="streak-chip" style="display:none"></span>
      </div>
    </header>

    <div class="scoreboard" role="status" aria-live="polite" aria-label="Scoreboard">
      <div class="sb-runs">
        <div class="sb-label">Runs</div>
        <div class="sb-val" id="sb-runs" aria-live="polite">0</div>
      </div>
      <div class="sb-strikes" aria-label="Strikes">
        <div class="sb-label">Strikes</div>
        <div class="dots" id="sb-strike-dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <div class="sb-outs" aria-label="Outs">
        <div class="sb-label">Outs</div>
        <div class="dots dots-r" id="sb-out-dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>
    <div class="weekly">
      <div><span class="wk-val" id="wk-runs">0</span>Runs this week</div>
      <div class="wk-dots" id="wk-dots"></div>
    </div>

    <div class="diamond-wrap">
      <div class="diamond">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baseball diamond showing runners on base">
          <!-- Outfield grass: triangle from home (100,160), capped by back arc -->
          <path d="M 100 160 L 195 65 Q 100 -30 5 65 Z"
            fill="#3D5B3B" fill-opacity="0.12" stroke="none"/>
          <!-- Outfield wall / warning track -->
          <path d="M 5 65 Q 100 -30 195 65"
            fill="none" stroke="#1A1612" stroke-width="2"
            stroke-linecap="round"/>
          <!-- Baseball-stitch detail (inner red, dashed) -->
          <path d="M 11 71 Q 100 -19 189 71"
            fill="none" stroke="#B22A2B" stroke-width="1"
            stroke-dasharray="2 5" stroke-linecap="round"/>
          <!-- Foul lines from home plate through 1B/3B and out to the wall -->
          <line x1="100" y1="160" x2="195" y2="65"
            stroke="#1A1612" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="100" y1="160" x2="5"   y2="65"
            stroke="#1A1612" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Infield dirt fill -->
          <polygon points="100,40 160,100 100,160 40,100"
            fill="#8B6A3F" fill-opacity="0.22" stroke="none"/>
          <!-- Baselines (the actual diamond) -->
          <polygon points="100,40 160,100 100,160 40,100"
            fill="none" stroke="#1A1612" stroke-width="2"
            stroke-linejoin="round"/>
          <!-- Pitcher's mound -->
          <circle cx="100" cy="100" r="9"
            fill="#8B6A3F" fill-opacity="0.55"
            stroke="#1A1612" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="2.5" fill="#1A1612"/>
          <!-- Bases — 1B, 2B, 3B kept; home plate sits on the diamond's bottom vertex -->
          <rect class="base" id="base-2b" x="93" y="33"  width="14" height="14" transform="rotate(45 100 40)"/>
          <rect class="base" id="base-1b" x="153" y="93" width="14" height="14" transform="rotate(45 160 100)"/>
          <rect class="base" id="base-3b" x="33" y="93"  width="14" height="14" transform="rotate(45 40 100)"/>
          <!-- Home plate: pentagon, flat edge faces pitcher, point faces catcher -->
          <polygon class="base" id="base-hr" points="93,153 107,153 107,160 100,167 93,160"/>
        </svg>
      </div>
    </div>

    <main id="game-area" aria-live="polite" aria-atomic="false"></main>

    <div class="dev-reset" id="dev-reset" hidden><a id="reset-link">↻ reset (dev)</a></div>

    <footer><span class="star">★</span> Play Ball <span class="star">★</span></footer>
  </div>

<script>
  // ---------- PLAYER DICTIONARY (autocomplete pool) ----------
  // The inline list seeds autocomplete for instant feedback on first load.
  // After the page renders we lazy-fetch players.json — the full Chadwick
  // Register (~22k names) — and concat it. Curated names stay first so they
  // surface before any deep-cut name a fuzzy match might also hit.
  let PLAYERS = [
    // Batters — current/recent
    "Jose Altuve","Aaron Judge","Bryce Harper","Mike Trout","Mookie Betts",
    "Cody Bellinger","Christian Yelich","Manny Machado","Vladimir Guerrero Jr.",

    "Todd Helton","Tony Gwynn","Ichiro Suzuki","Albert Pujols","Chipper Jones",
    "Larry Walker","Adrian Beltre","Barry Bonds","Alex Rodriguez","Vladimir Guerrero",
    "Manny Ramirez","Sammy Sosa","Mark McGwire","Albert Belle","Frank Thomas",
    "Ken Griffey Jr.","Miguel Cabrera","Jeff Bagwell","Joey Votto","Robinson Cano",

    // Batters — classic
    "Hank Aaron","Ted Williams","Babe Ruth","Lou Gehrig","Joe DiMaggio",

    "Rickey Henderson","Vince Coleman","Lou Brock","Tim Raines","Yogi Berra",
    "Roy Campanella","Larry Doby","Roger Maris","Frank Robinson","Hank Thompson",
    // Pitchers — current
    "Clayton Kershaw","Corbin Burnes","Spencer Strider","Jacob deGrom",
    "Justin Verlander","Max Scherzer","Gerrit Cole","Chris Sale","Tarik Skubal",
    "Dylan Cease","Shane Bieber","Blake Snell","Charlie Morton","Walker Buehler",
    "Lance Lynn","Patrick Corbin","Yu Darvish","Yoshinobu Yamamoto","Paul Skenes",
    "Trevor Bauer","Sonny Gray","Hyun Jin Ryu","Yusei Kikuchi","Stephen Strasburg",
    "Kenta Maeda","Aaron Nola","Zack Wheeler","Logan Webb","Tyler Glasnow",
    "Carlos Carrasco","Kevin Gausman","Luis Castillo","Pablo Lopez",
    // Pitchers — closers / relievers
    "Mariano Rivera","Trevor Hoffman","Lee Smith","Dennis Eckersley","Kenley Jansen",
    "Craig Kimbrel","Aroldis Chapman","Edwin Diaz","Josh Hader","Eric Gagne",
    // Pitchers — '90s / '00s / '10s
    "R.A. Dickey","Roy Halladay","Felix Hernandez","Tim Lincecum","Jose Fernandez",
    "Adam Wainwright","Madison Bumgarner","Pedro Martinez","Greg Maddux",
    "Randy Johnson","Roger Clemens","Tom Glavine","John Smoltz","Steve Avery",
    "CC Sabathia","David Price","Cliff Lee","Tim Hudson","Mark Buehrle",
    "Curt Schilling","Mike Mussina","Andy Pettitte","Bartolo Colon",
    "Johan Santana","Brandon Webb",
    // Pitchers — classic
    "Nolan Ryan","Sandy Koufax","Warren Spahn","Don Drysdale","Whitey Ford",
    "Bob Gibson","Steve Carlton","Don Larsen","Tim Salmon","Garret Anderson"
  ];
  // Pre-normalized parallel array — avoids recomputing norm() on every keystroke.
  let PLAYER_NORM = PLAYERS.map(norm);

  async function loadFullPlayers() {
    try {
      const list = await fetch("players.json", { cache: "force-cache" }).then(r => r.ok ? r.json() : null);
      if (!Array.isArray(list)) return;
      const seen = new Set(PLAYERS);
      for (const p of list) if (!seen.has(p)) PLAYERS.push(p);
      PLAYER_NORM = PLAYERS.map(norm);
    } catch {}
  }

  // ---------- STATE ----------
  let puzzle = null;
  const state = {
    pitchIndex: 0,
    strikes: 0,           // resets each at-bat
    outs: 0,
    runs: 0,
    bases: { "1B": false, "2B": false, "3B": false },
    pitchOutcomes: [],    // 'hit' | 'out', one per completed at-bat
    pitchHits: [],        // 'single'|'double'|'triple'|'hr'|null  per at-bat
    pitchRBI: [],         // runs driven in by this hit
    pitchGuesses: [],     // [[guess,...], ...] per at-bat
    pitchHints: [],       // hints revealed (count) per at-bat
    swingsTotal: 0,       // not headlined, kept for share footer
    gameOver: false,
  };

  // Each tier's question is a different kind of hit.
  // Pitch-card subtitle: tells player what kind of hit this at-bat earns.
  const TIER_LABEL = { "1B": "SINGLE", "2B": "DOUBLE", "3B": "TRIPLE", "HR": "HOME RUN" };
  const TIER_HIT   = { "1B": "single", "2B": "double", "3B": "triple", "HR": "hr" };
  const HIT_LABEL  = { single: "SINGLE", double: "DOUBLE", triple: "TRIPLE", hr: "HOME RUN" };
  const HIT_BASES  = { single: 1, double: 2, triple: 3, hr: 4 };

  // ---------- PERSISTENCE ----------
  const STORAGE_KEY = "rtb:state";
  let storage = { history: {}, streak: 0, lastPlayedDate: null };

  function loadStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) storage = { history: {}, streak: 0, lastPlayedDate: null, ...JSON.parse(raw) };
    } catch {}
  }
  function saveStorage() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(storage)); } catch {}
  }
  function snapshotGame() {
    return {
      pitchIndex: state.pitchIndex, strikes: state.strikes, outs: state.outs, runs: state.runs,
      bases: { ...state.bases },
      pitchOutcomes: [...state.pitchOutcomes], pitchHits: [...state.pitchHits], pitchRBI: [...state.pitchRBI],
      pitchGuesses: state.pitchGuesses.map(g => [...g]), pitchHints: [...state.pitchHints],
      swingsTotal: state.swingsTotal, gameOver: state.gameOver,
    };
  }
  function restoreGame(snap) { Object.assign(state, snap); }
  function yesterdayOf(iso) {
    const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() - 1);
    return d.toISOString().slice(0,10);
  }
  // Mon-Sun week containing the given ISO date. Returns ['YYYY-MM-DD' x 7].
  function weekDates(iso) {
    const d = new Date(iso + "T00:00:00");
    const offset = (d.getDay() + 6) % 7; // days since Monday
    const monday = new Date(d); monday.setDate(d.getDate() - offset);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const x = new Date(monday); x.setDate(monday.getDate() + i);
      out.push(x.toISOString().slice(0, 10));
    }
    return out;
  }
  function updateStreakOnce(date) {
    if (storage.lastPlayedDate === date) return;
    if (storage.lastPlayedDate === yesterdayOf(date)) storage.streak = (storage.streak || 0) + 1;
    else storage.streak = 1;
    storage.lastPlayedDate = date;
  }
  // Lightweight wrapper — GoatCounter custom events. No-op if the script
  // hasn't loaded (preview / offline / blocked).
  function track(path, title) {
    try { window.goatcounter?.count?.({ path: `event-${path}`, title, event: true }); } catch {}
  }

  function persist() {
    const date = puzzle.date;
    if (state.gameOver) {
      if (!storage.history[date]) {
        storage.history[date] = snapshotGame();
        updateStreakOnce(date);
        track(`game-completed-${state.runs}r`, `Game Completed: ${state.runs} runs`);
      }
      delete storage.inProgress;
    } else {
      storage.inProgress = { date, ...snapshotGame() };
    }
    saveStorage();
  }

  function norm(s) {
    return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  }

  // ---------- ONBOARDING (first visit only) ----------
  function maybeShowOnboarding() {
    if (storage.onboarded) return;
    if (Object.keys(storage.history || {}).length > 0) return;  // returning user
    const mask = document.createElement("div");
    mask.className = "onboard-mask";
    mask.setAttribute("role", "dialog");
    mask.setAttribute("aria-modal", "true");
    mask.setAttribute("aria-labelledby", "ob-title");
    mask.innerHTML = `
      <div class="onboard">
        <h2 id="ob-title">How to play</h2>
        <div class="ob-steps">
          <div class="ob-step"><span class="ob-num">1</span><span>Face <b>four pitches</b> — single, double, triple, home run.</span></div>
          <div class="ob-step"><span class="ob-num">2</span><span>Right answer = <b>hit</b>. Three wrong on one = <b>strikeout</b>.</span></div>
          <div class="ob-step"><span class="ob-num">3</span><span>Runners advance per real baseball. Score <b>runs</b>.</span></div>
        </div>
        <button class="onboard-go" type="button" autofocus>Play Ball</button>
      </div>
    `;
    mask.querySelector(".onboard-go").addEventListener("click", () => {
      storage.onboarded = true; saveStorage();
      mask.remove();
    });
    // Escape key closes too.
    mask.addEventListener("keydown", e => { if (e.key === "Escape") mask.querySelector(".onboard-go").click(); });
    document.body.appendChild(mask);
    setTimeout(() => mask.querySelector(".onboard-go").focus(), 30);
  }

  // ---------- A2HS (Add to Home Screen) ----------
  // Chrome / Android: capture beforeinstallprompt so we can trigger natively later.
  let _deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    _deferredInstallPrompt = e;
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }
  function shouldOfferA2HS() {
    if (isStandalone()) return false;            // already installed
    if (storage.a2hsDismissed) return false;     // user said no thanks
    if (Object.keys(storage.history).length < 1) return false;  // earn it first
    return isIOS() || _deferredInstallPrompt !== null;
  }

  function renderA2HS() {
    const card = document.createElement("div");
    card.className = "a2hs";
    card.innerHTML = `
      <div class="a2hs-icon">⚾</div>
      <div class="a2hs-body">
        <div class="a2hs-title">Play daily?</div>
        <div class="a2hs-text">Add Round the Bases to your home screen.</div>
      </div>
      <button class="a2hs-action">${isIOS() ? "How" : "Install"}</button>
      <button class="a2hs-dismiss" aria-label="Dismiss">×</button>
    `;
    card.querySelector(".a2hs-dismiss").addEventListener("click", () => {
      track("a2hs-dismissed", "A2HS Dismissed");
      storage.a2hsDismissed = true; saveStorage();
      card.remove();
    });
    card.querySelector(".a2hs-action").addEventListener("click", async () => {
      if (isIOS()) {
        // No programmatic install on iOS — show explicit steps inline.
        const steps = document.createElement("div");
        steps.className = "a2hs-ios-steps";
        steps.innerHTML = "Tap <b>Share</b> ↑ in Safari, then <b>Add to Home Screen</b>.";
        card.appendChild(steps);
        card.querySelector(".a2hs-action").remove();
      } else if (_deferredInstallPrompt) {
        _deferredInstallPrompt.prompt();
        const choice = await _deferredInstallPrompt.userChoice;
        _deferredInstallPrompt = null;
        track(`a2hs-${choice?.outcome || "unknown"}`, `A2HS: ${choice?.outcome || "unknown"}`);
        if (choice && choice.outcome === "accepted") {
          storage.a2hsDismissed = true; saveStorage();
          card.remove();
        }
      }
    });
    return card;
  }

  // ---------- COUNTDOWN ----------
  // Live-updating "Next inning in 7h 12m" timer keyed to ET midnight.
  // Switches to seconds resolution under one hour for the last-minute drama.
  let _countdownTimer = null;
  function startCountdown(el) {
    if (_countdownTimer) clearTimeout(_countdownTimer);
    function tick() {
      const ms = msUntilNextDay();
      if (ms <= 0) { el.textContent = "Next inning ready ⚾"; return; }
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      el.textContent = h > 0
        ? `Next inning in ${h}h ${m}m`
        : `Next inning in ${m}m ${s}s`;
      const nextDelay = h > 0 ? 30000 : 1000;
      _countdownTimer = setTimeout(tick, nextDelay);
    }
    tick();
  }

  // ---------- SHARE IMAGE (canvas → PNG) ----------
  async function renderShareImage() {
    // Ensure web fonts are loaded before drawing — Canvas falls back silently otherwise.
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch {}
    }
    const W = 1200, H = 630;       // OG / Twitter-card friendly ratio
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#F1E4C8";
    ctx.fillRect(0, 0, W, H);

    // Halftone stipple
    ctx.fillStyle = "rgba(26, 22, 18, 0.05)";
    for (let y = 4; y < H; y += 8) {
      for (let x = 4; x < W; x += 8) {
        ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Outer dashed ticket-stub border
    ctx.strokeStyle = "#1A1612";
    ctx.lineWidth = 4;
    ctx.setLineDash([18, 12]);
    ctx.strokeRect(36, 36, W - 72, H - 72);
    ctx.setLineDash([]);

    // Header — eyebrow
    ctx.textAlign = "center";
    ctx.fillStyle = "#B22A2B";
    ctx.font = "20px 'Special Elite', monospace";
    ctx.fillText("★  DAILY  ★", W / 2, 100);

    // Title
    ctx.fillStyle = "#1A1612";
    ctx.font = "78px 'Alfa Slab One', serif";
    ctx.fillText("ROUND THE BASES", W / 2, 175);

    // Double underline
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 360, 200); ctx.lineTo(W / 2 + 360, 200);
    ctx.moveTo(W / 2 - 360, 208); ctx.lineTo(W / 2 + 360, 208);
    ctx.stroke();

    // Subhead — day + date
    ctx.fillStyle = "#1A1612";
    ctx.font = "22px 'Special Elite', monospace";
    ctx.fillText(`DAY NO. ${puzzle.puzzleNumber}   |   ${formatDate(puzzle.date).toUpperCase()}`, W / 2, 248);

    // Big number — runs
    const runs = state.runs;
    const headline = runs === 0 ? "HELD SCORELESS" : String(runs);
    ctx.fillStyle = "#1A1612";
    if (runs === 0) {
      ctx.font = "82px 'Alfa Slab One', serif";
      ctx.fillText(headline, W / 2, 380);
    } else {
      ctx.font = "200px 'Alfa Slab One', serif";
      ctx.fillText(headline, W / 2, 420);
      ctx.font = "52px 'Alfa Slab One', serif";
      ctx.fillText(runs === 1 ? "RUN" : "RUNS", W / 2, 475);
    }

    // Grid of outcomes
    const grid = ["⬜","⬜","⬜","⬜"];
    state.pitchOutcomes.forEach((o, i) => grid[i] = o === "hit" ? "⚾" : "✗");
    ctx.font = "64px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
    ctx.fillText(grid.join("  "), W / 2, 540);

    // Streak + footer
    ctx.fillStyle = "#1A1612";
    ctx.font = "18px 'Special Elite', monospace";
    const lob = ["1B","2B","3B"].filter(b => state.bases[b]).length;
    const meta = [
      storage.streak > 0 ? `🔥 STREAK ${storage.streak}` : null,
      lob ? `${lob} LOB` : null,
      "playroundthebases.com"
    ].filter(Boolean).join("    ·    ");
    ctx.fillText(meta, W / 2, 590);

    return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  }

  // ---------- INIT ----------
  function freshState() {
    Object.assign(state, {
      pitchIndex: 0, strikes: 0, outs: 0, runs: 0,
      bases: { "1B": false, "2B": false, "3B": false },
      pitchOutcomes: [], pitchHits: [], pitchRBI: [],
      pitchGuesses: puzzle.pitches.map(() => []),
      pitchHints: puzzle.pitches.map(() => 0),
      swingsTotal: 0, gameOver: false,
    });
  }
  // Anchor "today" to ET — uniform rollover at ET midnight regardless of
  // where the player is. Baseball runs on ET; so does this game.
  const GAME_TZ = "America/New_York";
  function todayISO() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: GAME_TZ }).format(new Date());
  }
  // ms until the next midnight in GAME_TZ.
  function msUntilNextDay() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: GAME_TZ, hourCycle: "h23",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
    }).formatToParts(new Date());
    const get = t => parseInt(parts.find(p => p.type === t).value, 10);
    const h = get("hour"), m = get("minute"), s = get("second");
    return ((24 - h) * 3600 - m * 60 - s) * 1000;
  }

  async function init() {
    loadStorage();
    const today = todayISO();
    // Always revalidate — puzzle JSON is small and the cron may have just
    // pushed today's file; we don't want a stale cached response.
    const opts = { cache: "no-cache" };
    let resp = await fetch(`puzzles/${today}.json`, opts);
    if (!resp.ok) resp = await fetch("puzzles/2026-06-05.json", opts);
    puzzle = await resp.json();
    freshState();
    document.getElementById("day-no").textContent = "Day No. " + puzzle.puzzleNumber;
    document.getElementById("day-date").textContent = formatDate(puzzle.date);

    // Restore today's progress or completed game
    if (storage.history[puzzle.date]) {
      restoreGame(storage.history[puzzle.date]);
    } else if (storage.inProgress && storage.inProgress.date === puzzle.date) {
      restoreGame(storage.inProgress);
    }
    render();
    updateStreakHeader();
    maybeShowOnboarding();
    // Lazy — doesn't block first paint; autocomplete just expands once it lands.
    loadFullPlayers();

    // Dev-only reset link — visible on localhost or when ?dev is in the URL.
    const isDev = /^(localhost|127\.|0\.0\.0\.0|.*\.local)/i.test(location.hostname) || /[?&]dev\b/.test(location.search);
    if (isDev) document.getElementById("dev-reset").hidden = false;

    document.getElementById("reset-link").addEventListener("click", () => {
      delete storage.history[puzzle.date];
      delete storage.inProgress;
      saveStorage();
      freshState(); render(); updateStreakHeader();
    });
  }

  function updateWeekly() {
    if (!puzzle) return;
    const dates = weekDates(puzzle.date);
    const runsEl = document.getElementById("wk-runs");
    const dotsEl = document.getElementById("wk-dots");
    if (!runsEl || !dotsEl) return;
    let total = 0;
    dotsEl.innerHTML = "";
    const labels = ["M","T","W","T","F","S","S"];
    dates.forEach((d, i) => {
      const h = storage.history[d];
      if (h) total += h.runs || 0;
      const dot = document.createElement("span");
      dot.className = "wk-dot";
      if (h) dot.classList.add("played");
      if (d === puzzle.date) dot.classList.add("today");
      dot.title = `${labels[i]} ${d}` + (h ? ` — ${h.runs} runs` : "");
      dotsEl.appendChild(dot);
    });
    // Include in-progress runs even if not yet completed
    if (!storage.history[puzzle.date]) total += state.runs;
    runsEl.textContent = total;
  }

  function updateStreakHeader() {
    const chip = document.getElementById("streak-chip");
    const pipe = document.getElementById("streak-pipe");
    if (!chip) return;
    if (storage.streak > 0) {
      chip.style.display = ""; pipe.style.display = "";
      chip.textContent = `🔥 ${storage.streak}`;
    } else {
      chip.style.display = "none"; pipe.style.display = "none";
    }
  }

  function formatDate(iso) {
    const [y,m,d] = iso.split("-").map(Number);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${months[m-1]} ${d}, ${y}`;
  }

  // ---------- CORE GAME ----------
  // Advance existing runners by `bases` and place batter; returns runs scored.
  function advanceRunners(hitType) {
    const advance = HIT_BASES[hitType];
    const old = { ...state.bases };
    state.bases = { "1B": false, "2B": false, "3B": false };
    let runs = 0;
    // Move existing runners (process from 3B down so we don't double-place).
    for (const b of ["3B", "2B", "1B"]) {
      if (!old[b]) continue;
      const startNum = { "1B": 1, "2B": 2, "3B": 3 }[b];
      const target = startNum + advance;
      if (target >= 4) runs++;
      else state.bases[["1B", "2B", "3B"][target - 1]] = true;
    }
    // Place batter
    if (hitType === "hr") runs++;
    else state.bases[{ single: "1B", double: "2B", triple: "3B" }[hitType]] = true;
    return runs;
  }

  function advancePitch() {
    state.strikes = 0; // fresh at-bat
    if (state.outs >= 3 || state.pitchIndex === puzzle.pitches.length - 1) {
      state.gameOver = true;
    } else {
      state.pitchIndex++;
    }
  }

  function submitGuess(guess) {
    if (state.gameOver) return;
    const pitch = puzzle.pitches[state.pitchIndex];
    state.swingsTotal++;
    state.pitchGuesses[state.pitchIndex].push(guess);

    if (norm(guess) === norm(pitch.answer)) {
      // HIT
      const hitType = TIER_HIT[pitch.tier];
      const rbi = advanceRunners(hitType);
      state.runs += rbi;
      state.pitchOutcomes.push("hit");
      state.pitchHits.push(hitType);
      state.pitchRBI.push(rbi);
      advancePitch();
    } else {
      // STRIKE
      state.strikes++;
      state.pitchHints[state.pitchIndex]++;
      if (state.strikes >= 3) {
        // STRIKEOUT
        state.outs++;
        state.pitchOutcomes.push("out");
        state.pitchHits.push(null);
        state.pitchRBI.push(0);
        advancePitch();
      }
    }
    persist();
    render();
  }

  // ---------- RENDER ----------
  function render() {
    // scoreboard
    document.getElementById("sb-runs").textContent = state.runs;
    document.querySelectorAll("#sb-strike-dots .dot").forEach((d, i) =>
      d.classList.toggle("on", i < state.strikes));
    document.querySelectorAll("#sb-out-dots .dot").forEach((d, i) =>
      d.classList.toggle("on", i < state.outs));

    // diamond — bases occupied by current runners
    ["1B","2B","3B"].forEach(b => {
      const el = document.getElementById("base-" + b.toLowerCase());
      el.classList.toggle("occupied", !!state.bases[b]);
    });

    const area = document.getElementById("game-area");
    area.innerHTML = "";
    if (state.gameOver) area.appendChild(renderResult());
    else area.appendChild(renderPitch());
    updateStreakHeader();
    updateWeekly();
  }

  function renderPitch() {
    const pitch = puzzle.pitches[state.pitchIndex];
    const tier  = pitch.tier;
    const guesses = state.pitchGuesses[state.pitchIndex];
    const hintsShown = state.pitchHints[state.pitchIndex];

    const card = document.createElement("section");
    card.className = "card";

    const tag = document.createElement("div");
    tag.className = "pitch-tag";
    tag.innerHTML = `PITCH ${state.pitchIndex+1} <span class="tier">· ${TIER_LABEL[tier]}</span>`;
    card.appendChild(tag);

    // PROMPT
    if (pitch.type === "arsenal") {
      const p = document.createElement("div");
      p.className = "arsenal";
      pitch.prompt.pitches.forEach(pp => {
        p.insertAdjacentHTML("beforeend",
          `<div class="ars-emoji">${pp.emoji}</div>
           <div class="ars-name">${pp.name}</div>
           <div class="ars-speed">${pp.speed} mph</div>
           <div class="ars-usage">${pp.usage}%</div>`);
      });
      card.appendChild(p);
    } else {
      const p = document.createElement("p");
      p.className = "prompt";
      p.textContent = pitch.prompt;
      card.appendChild(p);
    }

    // OPENING HINT (always shown for 3B/HR if present)
    if (pitch.openingHint) {
      const h = document.createElement("div");
      h.className = "opening-hint";
      h.textContent = "· " + pitch.openingHint + " ·";
      card.appendChild(h);
    }

    // INPUT
    if (pitch.type === "trivia" || pitch.type === "career_arc") {
      const choices = document.createElement("div");
      choices.className = "choices";
      choices.setAttribute("role", "group");
      choices.setAttribute("aria-label", "Choose an answer");
      let firstEnabled = null;
      pitch.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = choice;
        btn.setAttribute("type", "button");
        const alreadyWrong = guesses.some(g => norm(g) === norm(choice));
        if (alreadyWrong) {
          btn.classList.add("wrong"); btn.disabled = true;
          btn.setAttribute("aria-label", `${choice} — incorrect`);
        }
        btn.addEventListener("click", () => submitGuess(choice));
        choices.appendChild(btn);
        if (!alreadyWrong && !firstEnabled) firstEnabled = btn;
      });
      card.appendChild(choices);
      if (firstEnabled) setTimeout(() => firstEnabled.focus(), 30);
    } else {
      card.appendChild(renderFreeText(pitch));
    }

    // PROGRESSIVE HINTS revealed by wrong guesses
    if (pitch.progressiveHints && hintsShown > 0) {
      const hbox = document.createElement("div");
      hbox.className = "hints";
      pitch.progressiveHints.slice(0, hintsShown).forEach(h => {
        const el = document.createElement("div");
        el.className = "hint"; el.textContent = h;
        hbox.appendChild(el);
      });
      card.appendChild(hbox);
    }

    // PAST GUESSES (for free-text)
    if ((pitch.type === "stat_line" || pitch.type === "arsenal") && guesses.length) {
      const past = document.createElement("div");
      past.className = "past";
      guesses.forEach(g => {
        past.insertAdjacentHTML("beforeend",
          `<div class="row"><span class="x">✗</span><span>${g}</span></div>`);
      });
      card.appendChild(past);
    }

    return card;
  }

  function renderFreeText(pitch) {
    const wrap = document.createElement("div");
    wrap.className = "input-wrap";
    const row = document.createElement("div");
    row.className = "input-row";

    const input = document.createElement("input");
    input.type = "text"; input.className = "text-input";
    input.placeholder = "Type a player name…"; input.autocomplete = "off";
    input.setAttribute("aria-label", "Guess the player");
    input.setAttribute("aria-autocomplete", "list");

    const btn = document.createElement("button");
    btn.className = "swing-btn"; btn.textContent = "SWING";
    btn.disabled = true;

    const ac = document.createElement("div");
    ac.className = "autocomplete"; ac.style.display = "none";

    let suggestions = []; let activeIdx = -1;

    function update() {
      const q = norm(input.value);
      if (!q) { ac.style.display = "none"; btn.disabled = true; return; }
      // Linear scan with early termination — much faster than filter()/slice()
      // when PLAYERS contains the full ~22k Chadwick register.
      suggestions = [];
      for (let i = 0; i < PLAYERS.length && suggestions.length < 6; i++) {
        if (PLAYER_NORM[i].includes(q)) suggestions.push(PLAYERS[i]);
      }
      ac.innerHTML = "";
      suggestions.forEach((s, i) => {
        const d = document.createElement("div");
        d.textContent = s;
        if (i === activeIdx) d.classList.add("active");
        d.addEventListener("mousedown", e => { e.preventDefault(); input.value = s; ac.style.display = "none"; btn.disabled = false; });
        ac.appendChild(d);
      });
      ac.style.display = suggestions.length ? "block" : "none";
      btn.disabled = !input.value.trim();
    }

    input.addEventListener("input", () => { activeIdx = -1; update(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { activeIdx = Math.min(activeIdx + 1, suggestions.length - 1); update(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { activeIdx = Math.max(activeIdx - 1, -1); update(); e.preventDefault(); }
      else if (e.key === "Enter") {
        e.preventDefault();
        const v = activeIdx >= 0 ? suggestions[activeIdx] : input.value.trim();
        if (v) submitGuess(v);
      }
    });
    input.addEventListener("blur", () => setTimeout(() => ac.style.display = "none", 120));

    btn.addEventListener("click", () => { if (input.value.trim()) submitGuess(input.value.trim()); });

    row.appendChild(input); row.appendChild(btn);
    wrap.appendChild(row); wrap.appendChild(ac);
    setTimeout(() => input.focus(), 30);
    return wrap;
  }

  // ---------- RESULT ----------
  function renderResult() {
    const card = document.createElement("section");
    card.className = "result-card";

    const runs = state.runs;
    const lob = ["1B","2B","3B"].filter(b => state.bases[b]).length;
    const grid = ["⬜","⬜","⬜","⬜"];
    state.pitchOutcomes.forEach((o, i) => grid[i] = o === "hit" ? "⚾" : "✗");
    // Indices past the last faced at-bat are "didn't bat".
    const lastFaced = state.pitchOutcomes.length - 1;

    const title = document.createElement("h2");
    title.className = "result-title";
    title.textContent = runs === 0 ? "HELD SCORELESS" : `${runs} RUN${runs === 1 ? "" : "S"}`;
    card.appendChild(title);

    const subParts = [];
    if (lob) subParts.push(`Left ${lob} on base`);
    subParts.push(`${state.swingsTotal} swings`);
    const sub = document.createElement("div");
    sub.className = "result-sub";
    sub.textContent = subParts.join(" · ");
    card.appendChild(sub);

    const bases = document.createElement("div");
    bases.className = "result-bases";
    puzzle.pitches.forEach((p, i) => {
      const o = state.pitchOutcomes[i];
      const hit = state.pitchHits[i];
      const rbi = state.pitchRBI[i] || 0;
      const notFaced = i > lastFaced;
      const mark = notFaced ? "—" : (o === "hit" ? "⚾" : "✗");
      const detail = notFaced
        ? "did not bat"
        : (o === "hit" ? `${HIT_LABEL[hit].toLowerCase()}${rbi ? ` · ${rbi} RBI` : ""}` : "K");
      const miss = o !== "hit";
      const ans = miss ? `<span class="ans">(${p.answer})</span>` : p.answer;
      bases.insertAdjacentHTML("beforeend",
        `<div class="br-row ${miss?'miss':''}"><span class="br-tier">${p.tier}</span><span class="br-mark">${mark}</span><span>${ans} <span class="br-detail">${detail}</span></span></div>`);
    });
    card.appendChild(bases);

    const headline = runs === 0 ? "Held scoreless" : `${runs} run${runs === 1 ? "" : "s"}`;
    const streakLine = storage.streak > 1 ? `streak ${storage.streak} 🔥\n` : "";
    const shareText =
      `Round the Bases #${puzzle.puzzleNumber}\n` +
      `${headline}${lob ? ` · ${lob} LOB` : ""}\n` +
      `${grid.join("")}\n` +
      streakLine +
      `playroundthebases.com`;

    const share = document.createElement("div");
    share.className = "share-card"; share.textContent = shareText;
    card.appendChild(share);

    const btn = document.createElement("button");
    btn.className = "share-btn"; btn.textContent = "SHARE";
    btn.addEventListener("click", async () => {
      track("share-clicked", "Share Clicked");
      btn.textContent = "RENDERING…";
      try {
        const blob = await renderShareImage();
        const file = new File([blob], `round-the-bases-${puzzle.date}.png`, { type: "image/png" });
        const shareData = { files: [file], text: shareText, title: "Round the Bases" };
        if (navigator.canShare && navigator.canShare(shareData)) {
          await navigator.share(shareData);
          btn.textContent = "SHARED ✓";
        } else {
          // Desktop fallback: download PNG + copy text.
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `round-the-bases-${puzzle.date}.png`;
          document.body.appendChild(a); a.click(); a.remove();
          try { await navigator.clipboard.writeText(shareText); } catch {}
          btn.textContent = "DOWNLOADED ✓";
        }
      } catch (err) {
        // User cancelled or share failed — fall back to clipboard
        try { await navigator.clipboard.writeText(shareText); btn.textContent = "COPIED ✓"; }
        catch { btn.textContent = "SHARE FAILED"; }
      }
      setTimeout(() => btn.textContent = "SHARE", 1800);
    });
    card.appendChild(btn);

    const tomorrow = document.createElement("div");
    tomorrow.className = "tomorrow";
    card.appendChild(tomorrow);
    startCountdown(tomorrow);

    card.appendChild(renderBoxScore());
    if (shouldOfferA2HS()) card.appendChild(renderA2HS());
    return card;
  }

  // Which week the box score is showing; null = current week.
  let viewWeekStart = null;

  function renderBoxScore() {
    const dayLabels = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmtDate = d => {
      const [, m, dd] = d.split("-");
      return `${months[parseInt(m)-1]} ${parseInt(dd)}`;
    };

    const currentWeekStart = weekDates(puzzle.date)[0];
    const weekStart = viewWeekStart || currentWeekStart;
    const dates = weekDates(weekStart);
    const isCurrentWeek = weekStart === currentWeekStart;

    // Earliest week with any played history — caps how far back you can browse.
    const historyDates = Object.keys(storage.history).sort();
    const earliestWeekStart = historyDates.length ? weekDates(historyDates[0])[0] : currentWeekStart;
    const canGoBack = weekStart > earliestWeekStart;
    const canGoForward = !isCurrentWeek;
    const showNav = currentWeekStart > earliestWeekStart;

    const titleText = isCurrentWeek
      ? "This Week"
      : `Week of ${fmtDate(weekStart)}`;

    const box = document.createElement("div");
    box.className = "boxscore";
    const navHTML = showNav
      ? `<div class="bs-nav">
           <button class="bs-nav-btn" id="bs-prev" ${canGoBack ? "" : "disabled"}>‹</button>
           <button class="bs-nav-btn" id="bs-next" ${canGoForward ? "" : "disabled"}>›</button>
         </div>`
      : "";
    box.insertAdjacentHTML("beforeend",
      `<div class="bs-header"><div class="bs-title">${titleText}</div>${navHTML}</div>`);

    let total = 0, played = 0;
    dates.forEach((d, i) => {
      const h = storage.history[d];
      const isToday = d === puzzle.date;
      const isFuture = d > puzzle.date;
      let cls = "bs-row";
      let grid = "—";
      let runsCell = "—";
      if (h) {
        played++;
        total += h.runs || 0;
        const outs = h.pitchOutcomes || [];
        const cells = outs.map(o => o === "hit" ? "⚾" : "✗");
        while (cells.length < 4) cells.push("⬜");
        grid = cells.join("");
        runsCell = `${h.runs || 0} R`;
        if (isToday) cls += " today";
      } else if (isFuture) {
        cls += " future";
        grid = "⬜⬜⬜⬜";       // "to come" — visually waiting
      } else {
        cls += " missed";        // dash for "didn't bat"
      }
      box.insertAdjacentHTML("beforeend",
        `<div class="${cls}">
          <span class="bs-day">${dayLabels[i]}</span>
          <span class="bs-date">${fmtDate(d)}</span>
          <span class="bs-grid">${grid}</span>
          <span class="bs-runs">${runsCell}</span>
        </div>`);
    });

    box.insertAdjacentHTML("beforeend",
      `<div class="bs-total">
        <span class="bs-day">WK</span>
        <span></span>
        <span>${played} game${played === 1 ? "" : "s"}</span>
        <span class="bs-runs">${total} R</span>
      </div>`);

    // Hook up nav after the DOM is built.
    const prev = box.querySelector("#bs-prev");
    const next = box.querySelector("#bs-next");
    function shiftWeek(days) {
      const d = new Date(weekStart + "T00:00:00");
      d.setDate(d.getDate() + days);
      viewWeekStart = d.toISOString().slice(0, 10);
      // Re-render in place: replace the boxscore element.
      const fresh = renderBoxScore();
      box.replaceWith(fresh);
    }
    if (prev) prev.addEventListener("click", () => shiftWeek(-7));
    if (next) next.addEventListener("click", () => shiftWeek(+7));

    return box;
  }

  init();
</script>
