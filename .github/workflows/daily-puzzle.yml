name: Daily puzzle

on:
  schedule:
    # 22:00 UTC = 5 p.m. ET (6 p.m. EDT). Runs well before ET midnight rollover
    # so the new day's puzzle exists before any ET player crosses the boundary.
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pybaseball data
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball-cache
          key: pybaseball-${{ runner.os }}

      - name: Install dependencies
        run: pip install pybaseball

      - name: Determine target date
        id: target
        run: |
          # ET tomorrow — the day key the front-end will request next.
          TARGET=$(TZ='America/New_York' date -d "tomorrow" +%Y-%m-%d)
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Generating puzzle for $TARGET (ET)"

      - name: Generate puzzle
        run: python scripts/generate_puzzle.py ${{ steps.target.outputs.date }}

      - name: Commit and push if changed
        run: |
          git config user.name  "round-the-bases-bot"
          git config user.email "bot@users.noreply.github.com"
          git add puzzles/
          if git diff --cached --quiet; then
            echo "No new puzzle to commit."
          else
            git commit -m "Daily puzzle: ${{ steps.target.outputs.date }}"
            git push
          fi
